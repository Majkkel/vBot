<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>UMG-Bot</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="chat-container">
      <header class="chat-header">
        <div class="chat-logo">
          <!-- Ikona logo -->
          <svg
            class="logo-icon"
            width="40"
            height="40"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="12" cy="12" r="10" fill="#6C7A89" />
            <text
              x="50%"
              y="55%"
              text-anchor="middle"
              fill="#fff"
              font-size="13px"
              font-family="Roboto"
              dy=".3em"
            >
              C
            </text>
          </svg>
        </div>
        <div class="chat-title">UMG-Bot</div>
      </header>

      <div class="chat-box" id="chatBox">
        <!-- Przykładowa wiadomość powitalna -->
        <div class="message bot">Bot: Witaj! Jak mogę Ci pomóc?</div>
      </div>

      <div class="input-container">
        <input type="text" id="userInput" placeholder="Napisz wiadomość..." />
        <button id="sendBtn">Wyślij</button>
        <!-- Przycisk do nagrywania – domyślnie z ikoną mikrofonu -->
        <button id="recordBtn" title="Nagrywaj głos">
          <svg
            class="w-6 h-6 text-gray-800 dark:text-white"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              fill-rule="evenodd"
              d="M5 8a1 1 0 0 1 1 1v3a4.006 4.006 0 0 0 4 4h4a4.006 4.006 0 0 0 4-4V9a1 1 0 1 1 2 0v3.001A6.006 6.006 0 0 1 14.001 18H13v2h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2H9.999A6.006 6.006 0 0 1 4 12.001V9a1 1 0 0 1 1-1Z"
              clip-rule="evenodd"
            />
            <path
              d="M7 6a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4V6Z"
            />
          </svg>
        </button>
      </div>

      <footer class="chat-footer">
        <small>Powered by Michał Nieradko</small>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
